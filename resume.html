<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Rithik</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        html {
            font-size: 62.5%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .resume-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12rem 9% 6rem;
            text-align: center;
        }

        .resume-section h1 {
            font-size: 4rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
        }

        .resume-section h1 span {
            color: #b74b4b;
        }

        .resume-section p.subtitle {
            font-size: 2rem;
            color: #d1d1d1;
            margin-bottom: 3.5rem;
        }

        .resume-box {
            background-color: #161616;
            border-radius: 12px;
            padding: 4.5rem 5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .resume-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            max-width: 380px;
            margin-bottom: 3.5rem;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.4rem 3rem;
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            border-radius: 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            gap: 1.2rem;
            width: 100%;
        }

        .drive-btn {
            background: linear-gradient(45deg, #f58529, #e4405f);
        }

        .drive-btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(45deg, #e4405f, #f58529);
            box-shadow: 0 6px 25px rgba(228, 64, 95, 0.45);
        }

        .linkedin-btn {
            background: linear-gradient(45deg, #0077b5, #0a66c2);
        }

        .linkedin-btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(45deg, #0a66c2, #0077b5);
            box-shadow: 0 6px 25px rgba(0, 119, 181, 0.45);
        }

        .action-btn i {
            font-size: 2.2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.2rem 3.5rem;
            font-size: 1.8rem;
            font-weight: 500;
            background-color: #b74b4b;
            color: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(183, 75, 75, 0.3);
            min-width: 200px;
        }

        .back-button:hover {
            background-color: #a23a3a;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(183, 75, 75, 0.45);
        }

        @media (max-width: 768px) {
            .resume-section {
                padding: 10rem 5% 4rem;
            }

            .resume-section h1 {
                font-size: 3rem;
            }

            .resume-section p.subtitle {
                font-size: 1.6rem;
            }

            .resume-box {
                padding: 3rem 2rem;
            }

            .action-btn {
                font-size: 1.6rem;
                padding: 1.2rem 2.5rem;
            }

            .back-button {
                width: 100%;
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="Portfolio.html" class="logo">Rithik</a>

        <nav>
            <a href="Portfolio.html">Home</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="resume.html" class="active">Resume</a>
            <a href="skills.html">Skills</a>
            <a href="education.html">Education</a>
        </nav>
    </header>

    <section class="resume-section">
        <h1>My <span>Resume</span></h1>
        <p class="subtitle">Access my full resume and professional profile below:</p>
        <div class="resume-box">
            <div class="resume-buttons-group">
                <a href="https://drive.google.com/file/d/1ynUHLNQdjTRTbUD7dGjBGrUAR5YGvhJT/view?usp=sharing" target="_blank" class="action-btn drive-btn">
                    <i class="fa-solid fa-file-pdf"></i> View / Download Resume
                </a>

                <a href="https://www.linkedin.com/in/rithik-satya-rowthula-603a76394/" target="_blank" class="action-btn linkedin-btn">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn Profile
                </a>
            </div>

            <a href="Portfolio.html" class="back-button">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </section>

</body>

</html>
