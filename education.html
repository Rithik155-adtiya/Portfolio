<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education - Rithik</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        html {
            font-size: 62.5%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .education-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12rem 9% 6rem;
            text-align: center;
        }

        .education-section h1 {
            font-size: 4rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
        }

        .education-section h1 span {
            color: #b74b4b;
        }

        .education-section p.subtitle {
            font-size: 2rem;
            color: #d1d1d1;
            margin-bottom: 3.5rem;
        }

        .education-box {
            background-color: #161616;
            border-radius: 12px;
            padding: 4.5rem 5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 750px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .education-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            margin-bottom: 3.5rem;
            text-align: left;
        }

        .education-item {
            background-color: #1f1f1f;
            border-left: 4px solid #b74b4b;
            border-radius: 8px;
            padding: 2rem 2.5rem;
            display: flex;
            align-items: flex-start;
            gap: 1.8rem;
            transition: all 0.3s ease;
        }

        .education-item i {
            font-size: 2.6rem;
            color: #b74b4b;
            margin-top: 0.3rem;
            min-width: 30px;
            text-align: center;
            transition: 0.3s ease;
        }

        .education-item:hover {
            transform: translateX(6px);
            background-color: #252525;
            box-shadow: 0 4px 15px rgba(183, 75, 75, 0.25);
        }

        .education-item:hover i {
            color: #ff6b6b;
            transform: scale(1.15);
        }

        .education-info h3 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #b74b4b;
            margin-bottom: 0.5rem;
        }

        .education-info p {
            font-size: 1.6rem;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.2rem 3.5rem;
            font-size: 1.8rem;
            font-weight: 500;
            background-color: #b74b4b;
            color: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(183, 75, 75, 0.3);
            min-width: 200px;
        }

        .back-button:hover {
            background-color: #a23a3a;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(183, 75, 75, 0.45);
        }

        @media (max-width: 768px) {
            .education-section {
                padding: 10rem 5% 4rem;
            }

            .education-section h1 {
                font-size: 3rem;
            }

            .education-section p.subtitle {
                font-size: 1.6rem;
            }

            .education-box {
                padding: 3rem 2rem;
            }

            .education-item {
                padding: 1.6rem 1.8rem;
                gap: 1.4rem;
            }

            .education-info h3 {
                font-size: 1.7rem;
            }

            .education-info p {
                font-size: 1.4rem;
            }

            .back-button {
                width: 100%;
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="Portfolio.html" class="logo">Rithik</a>

        <nav>
            <a href="Portfolio.html">Home</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="resume.html">Resume</a>
            <a href="skills.html">Skills</a>
            <a href="education.html" class="active">Education</a>
        </nav>
    </header>

    <section class="education-section">
        <h1>My <span>Education</span></h1>
        <p class="subtitle">Academic background and qualifications:</p>
        <div class="education-box">
            <div class="education-list">
                <div class="education-item">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <div class="education-info">
                        <h3>B.Tech (CAI)</h3>
                        <p>Pragati University, Surampalem</p>
                    </div>
                </div>

                <div class="education-item">
                    <i class="fa-solid fa-building-columns"></i>
                    <div class="education-info">
                        <h3>Diploma Course</h3>
                        <p>Aditya Polytechnic Colleges, 2024-25-Present</p>
                    </div>
                </div>

                <div class="education-item">
                    <i class="fa-solid fa-school"></i>
                    <div class="education-info">
                        <h3>10th Standard</h3>
                        <p>Victory E.M High School, 2011-2022</p>
                    </div>
                </div>
            </div>

            <a href="Portfolio.html" class="back-button">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </section>

</body>

</html>
